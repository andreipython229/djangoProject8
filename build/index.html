<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Online shop selling dogs">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data:;">
    <title>Ni hao - Dog Shop</title>
    <link rel="icon" type="image/png" href="/static/img/icons8-favicon-50.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        .rounded-img {
            width: 100%;
            max-width: 400px;
            border-radius: 90%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
            padding: 0.6em;
            margin-bottom: 1em;
            transition: transform 0.3s ease;
        }
        .rounded-img:hover {
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
        .btn {
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark" role="navigation">
        <div class="container">
            <a class="navbar-brand p-0" href="/">
                <img src="/static/img/BS.png" alt="Shop Logo" width="40" height="40"/>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active text-light" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/api/places/">Favorite places</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container text-center my-5">
        <div class="row">
            <div class="col-lg-4 mx-auto">
                <img class="rounded-img" src="/static/img/IMG_20231101_220024_kopiya.jpg"
                     alt="Dog photo" width="400" height="400"/>
                <h1 class="fw-light">Ni hao - my dog</h1>
                <p class="lead text-muted">Online shop selling dogs</p>
                <button class="btn btn-primary" id="register-btn" aria-label="Register">Register</button>
                <div id="register-form" class="hidden" role="form" aria-label="Registration form">
                    <input type="text" class="form-control my-2" id="client-name" placeholder="Your name" aria-label="Your name" required>
                    <input type="tel" class="form-control my-2" id="client-phone" placeholder="Your phone" aria-label="Your phone" pattern="[0-9]{10}" required>
                    <button class="btn btn-success" id="login-btn" aria-label="Login">Login</button>
                </div>
                <div id="pet-details" class="hidden" role="region" aria-label="Pet details">
                    <button class="btn btn-info my-2" id="breed-btn" aria-label="Show breed">Breed</button>
                    <button class="btn btn-info my-2" id="age-btn" aria-label="Show age">Age</button>
                    <button class="btn btn-info my-2" id="price-btn" aria-label="Show price">Price</button>
                </div>
                <a href="https://github.com/andreipython229" target="_blank" rel="noopener noreferrer" class="btn btn-primary">My GitHub</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const registerBtn = document.getElementById("register-btn");
            const loginBtn = document.getElementById("login-btn");
            const registerForm = document.getElementById("register-form");
            const petDetails = document.getElementById("pet-details");

            registerBtn.addEventListener("click", function() {
                registerForm.classList.remove("hidden");
                registerBtn.setAttribute("aria-expanded", "true");
            });

            loginBtn.addEventListener("click", function() {
                const nameInput = document.getElementById("client-name");
                const phoneInput = document.getElementById("client-phone");

                if (nameInput.value && phoneInput.value) {
                    registerForm.classList.add("hidden");
                    petDetails.classList.remove("hidden");
                    registerBtn.setAttribute("aria-expanded", "false");
                } else {
                    alert("Please fill in all fields");
                }
            });
        });
    </script>
</body>
</html>

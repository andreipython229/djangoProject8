    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Bestdogs{% endblock %}</title>
        <!-- Ссылки на CSS, например Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Твои кастомные CSS, если есть -->
    </head>
    <body>
        <!-- Здесь может быть твой Navbar, как в index.html, но не забудь поправить ссылки на Django-пути -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Bestdogs!</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'dog_list' %}">Мои Собаки</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'places_page' %}">Любимые места</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="{% url 'login' %}" class="btn btn-primary me-2">Войти</a>
                        <a href="{% url 'register_page' %}" class="btn btn-success">Регистрация</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="content">
            {% block content %}
            {# Здесь будет вставляться контент из дочерних шаблонов #}
            {% endblock %}
        </div>

        <!-- Ссылки на JS, например Bootstrap Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Твои кастомные JS, если есть -->
    </body>
    </html>

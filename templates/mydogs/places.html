<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net; style-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net; img-src 'self' data:;">
    <title>My Favorite Places</title>
    <!-- Подключение стилей с использованием статического тега и nonce -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" nonce="{{ nonce }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" nonce="{{ nonce }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="index.html">
           <img src="{% static 'img/BS.png' %}" alt="BS" width="40" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-light" aria-current="page" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active text-light" href="/places/">Favorite places</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container my-5">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-5">
        {% for dog in dogs %}
          <div class="col">
            <div class="card my-custom-card">
              <img src="{{ dog.image }}" class="card-img-top" alt="{{ dog.name }}">
              <div class="card-body">
                <h5 class="card-title">{{ dog.name }} ({{ dog.age }} года, {{ dog.gender }})</h5>
                <p class="card-text"><b>{{ dog.place }}</b></p>
                <p class="card-text">{{ dog.description }}</p>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
    <!-- Inline-скрипт с nonce -->
    <script nonce="{{ nonce }}">
        document.addEventListener("DOMContentLoaded", function() {
            console.log("Страница 'Мои любимые места' загружена!");
        });
    </script>
  </body>
</html>

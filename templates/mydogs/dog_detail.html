{% extends 'base_django.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            {% if dog.photo %}
            <img src="{{ dog.photo.url }}" class="img-fluid rounded" alt="{{ dog.name }}">
            {% endif %}
        </div>
        <div class="col-md-6">
            <h1>{{ dog.name }}</h1>
            <p class="lead">{{ dog.description }}</p>

            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Информация</h5>
                    <ul class="list-unstyled">
                        <li><strong>Категория:</strong> {{ dog.category.name }}</li>
                        <li><strong>Возраст:</strong> {{ dog.age }} лет</li>
                        <li><strong>Владелец:</strong> {{ dog.owner.username }}</li>
                    </ul>
                </div>
            </div>

            <a href="{% url 'dog_list' %}" class="btn btn-secondary">Назад к списку</a>
        </div>
    </div>
</div>
{% endblock %}

<!-- templates/index.html -->
<!DOCTYPE html>
{% load static %}
{% load react_bundle %}
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DogShop</title>

  <!-- CSP -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net;
                 style-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net;
                 img-src 'self' data:;">

  <link rel="icon" type="image/png" href="{% static 'img/icons8-favicon-50.png' %}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
        nonce="{{ nonce }}" />
  <link rel="stylesheet" href="{% static 'css/styles/main.css' %}" nonce="{{ nonce }}" />

  <script nonce="{{ nonce }}">
    window.staticUrl = "{% static '' %}";
  </script>

  <style nonce="{{ nonce }}">
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .welcome-container {
      flex: 0 0 auto;
      padding: 20px 15px 10px;
      text-align: center;
    }
    .welcome-image {
      max-height: 40vh;
      max-width: 100%;
      object-fit: cover;
      border-radius: 0.375rem; /* rounded */
      box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
      margin: 0 auto;
      display: block;
    }
    #root {
      flex: 1 1 auto;
      padding: 15px;
    }
  </style>
</head>
<body>

  <div class="welcome-container">
    <h1 class="mb-3">Добро пожаловать в Bestdogs! 🐶</h1>

    <img
      src="{% static 'img/IMG_20231101_220024_kopiya.jpg' %}"
      alt="собака"
      class="welcome-image"
    />

    <p class="mt-3 text-muted fs-5">
      Это моя собака — Ni hao. Она всегда встречает гостей первой!
    </p>
  </div>

  <div id="root"></div>

  {% get_react_bundle %}
</body>
</html>

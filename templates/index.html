<!DOCTYPE html>
{% load static %}
{% load react_bundle %}
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DogShop</title>

    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net;
                   style-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net;
                   img-src 'self' data:;">

    <!-- Фавиконка -->
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"
          nonce="{{ nonce }}" />

    <!-- Собственные стили -->
    <link rel="stylesheet" href="{% static 'css/styles/main.css' %}" nonce="{{ nonce }}" />
</head>
<body>
    <div class="container mt-4 text-center">
        <h1 class="mb-4">Добро пожаловать в DogShop!</h1>

        <!-- Фото собаки -->
        <img src="{% static 'img/IMG_20231101_220024_kopiya.jpg' %}"
             alt="собака"
             class="img-fluid rounded shadow-sm inline-img" />

        <!-- React корень -->
        <div id="root" class="mt-4">Тестовый контент - React здесь</div>
    </div>

    <!-- React-бандл -->
    <script src="{% static 'js/main.66b7e630.js' %}" nonce="{{ nonce }}" defer></script>
</body>
</html>

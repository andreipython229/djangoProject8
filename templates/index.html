<!DOCTYPE html>
{% load static %}
{% load react_bundle %}
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DogShop</title>

    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net;
                   style-src 'self' 'nonce-{{ nonce }}' https://cdn.jsdelivr.net;
                   img-src 'self' data:;">

    <!-- Фавиконка -->
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"
          nonce="{{ nonce }}" />

    <!-- Собственные стили -->
    <link rel="stylesheet" href="{% static 'css/styles/main.css' %}" nonce="{{ nonce }}" />
</head>
<body class="bg-light" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container text-center p-3 border rounded bg-white shadow-sm" style="max-width: 600px;">
        <h2 class="mb-2">Добро пожаловать в <span class="text-primary">DogShop</span>!</h2>
        <h5 class="text-muted">Bestdogs 🐶</h5>

        <div class="my-3">
            <img src="{% static 'img/IMG_20231101_220024_kopiya.jpg' %}"
                 alt="Собака"
                 class="img-fluid rounded shadow"
                 style="max-width: 80px; height: auto;" />
            <p class="mt-2 mb-0"><strong>Ni hao 🐾</strong></p>
            <small class="text-muted">Это моя собака — она всегда встречает гостей первой!</small>
        </div>

        <hr class="my-3" />

        <div class="d-flex justify-content-around">
            <a href="/" class="btn btn-outline-primary btn-sm">Главная</a>
            <a href="/mydogs" class="btn btn-outline-secondary btn-sm">Мои Собаки</a>
            <a href="/places" class="btn btn-outline-success btn-sm">Любимые места</a>
        </div>

        <div id="root" class="mt-3">Загрузка приложения...</div>
    </div>

    <script src="/static/js/main.66b7e630.js" nonce="{{ nonce }}" defer></script>
</body>
</html>
